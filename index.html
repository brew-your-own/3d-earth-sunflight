<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Sun Flight</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; background: #000; }
      canvas { display: block; }

      /* ─── Collapsible panels (shared) ────────────────────────────────────
         Three corner panels (settings / route / recap) all collapse to a
         compact header via a single `.collapsed` class toggled by JS. */
      .panel {
        position: fixed;
        background: rgba(0, 0, 0, 0.55);
        border-radius: 6px;
        color: #ddd;
        z-index: 5;
      }
      /* Compact, content-width toggle — identical for all three panels. */
      .panel-toggle {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 6px;
        background: transparent;
        border: 0;
        color: #cfe;
        font: inherit;
        cursor: pointer;
        text-align: left;
        user-select: none;
      }
      .panel-toggle:hover { color: #fff; }
      .panel-toggle .chevron {
        font-size: 10px;
        transition: transform 0.15s;
        transform: rotate(90deg);          /* expanded: disclosure open */
      }
      .panel.collapsed .panel-toggle .chevron { transform: rotate(0deg); }
      .panel-body { display: flex; flex-direction: column; }
      .panel.collapsed .panel-body { display: none; }

      /* ─── Settings panel (top-left) ──────────────────────────────────── */
      #info {
        top: 12px;
        left: 12px;
        width: min(330px, calc(100vw - 24px));
        font: 13px/1.6 monospace;
      }
      /* Collapsed: shrink the box to the toggle so it isn't a wide empty panel. */
      #info.collapsed { width: fit-content; }
      #info .panel-body { padding: 2px 10px 10px; color: #aaa; }
      #info input[type="range"] {
        width: 110px;
        accent-color: #66aaff;
        vertical-align: middle;
      }
      #info label { display: inline-flex; gap: 6px; align-items: center; }
      #info-text a { color: #aaa; text-decoration: none; }
      #info-text a:hover { color: #fff; }
      #info-text a.github-link { vertical-align: -3px; margin-right: 4px; }
      #info-text .hud-cmd { cursor: pointer; user-select: none; }
      #info-text .hud-cmd:hover { color: #fff; }

      /* ─── Route panel (bottom-left) ──────────────────────────────────── */
      #route-form {
        bottom: 12px;
        left: 12px;
        width: min(440px, calc(100vw - 24px));
        font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        display: flex;
        flex-direction: column;
      }
      #route-form .panel-body {
        gap: 6px;
        padding: 10px 12px;
      }
      #route-form .panel-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
      }
      #route-form:not(.collapsed) .panel-bar {
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }
      #scrub { flex: 1; min-width: 0; accent-color: #66aaff; }
      #route-form .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
      #route-form .row label { display: flex; gap: 6px; align-items: center; }
      #route-form input[type="text"], #route-form .iata {
        width: 120px;
        padding: 4px 6px;
        background: #111;
        color: #fff;
        border: 1px solid #444;
        border-radius: 4px;
        font: inherit;
      }
      .iata-combo { position: relative; }
      .iata-suggest {
        display: none;
        position: absolute;
        bottom: 100%;
        left: 0;
        margin: 0 0 4px 0;
        padding: 4px 0;
        list-style: none;
        background: #1a1a1a;
        border: 1px solid #555;
        border-radius: 4px;
        min-width: 340px;
        max-width: calc(100vw - 48px);
        max-height: 240px;
        overflow-y: auto;
        z-index: 10;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6);
      }
      .iata-suggest.open { display: block; }
      .iata-suggest li {
        padding: 4px 10px;
        cursor: pointer;
        display: grid;
        grid-template-columns: 42px 1fr;
        column-gap: 8px;
        font-size: 12px;
        white-space: nowrap;
      }
      .iata-suggest li.selected { background: #2c4a6e; }
      .iata-suggest li:hover { background: #24405f; }
      .iata-suggest .code { color: #fff; font-weight: bold; }
      .iata-suggest .where { color: #cde; }
      .iata-suggest .name { color: #889; font-size: 11px; grid-column: 2; }
      #route-form input[type="datetime-local"] {
        padding: 3px 6px;
        background: #111;
        color: #fff;
        border: 1px solid #444;
        border-radius: 4px;
        font: inherit;
        color-scheme: dark;
      }
      #route-form button {
        padding: 4px 10px;
        background: #2a2a2a;
        color: #fff;
        border: 1px solid #555;
        border-radius: 4px;
        font: inherit;
        cursor: pointer;
      }
      #route-form button:hover { background: #3a3a3a; }
      #route-form button:disabled { opacity: 0.45; cursor: not-allowed; }
      .tz-info { color: #9ab; font-size: 11px; }
      .seg-toggle { display: inline-flex; border: 1px solid #555; border-radius: 4px; overflow: hidden; }
      #route-form .seg-toggle button {
        padding: 3px 8px;
        background: #1a1a1a;
        color: #aaa;
        border: 0;
        border-radius: 0;
        font: inherit;
        font-size: 11px;
      }
      #route-form .seg-toggle button.active { background: #2c4a6e; color: #fff; }
      #route-form .seg-toggle button:hover:not(.active) { background: #262626; }
      #arr-duration { width: 80px; }
      #via-list { display: flex; flex-direction: column; gap: 4px; }
      .via-item { display: flex; gap: 4px; align-items: center; }
      .remove-via {
        padding: 0 8px !important;
        font-size: 14px !important;
        line-height: 1.4;
        background: #1a1a1a !important;
        color: #aaa !important;
      }
      .remove-via:hover { color: #ff6b6b !important; }
      .add-wp { font-size: 11px !important; padding: 3px 8px !important; }
      #route-status { color: #aaa; min-height: 1.2em; }
      #route-status.error { color: #ff6b6b; }
      #flight-hud { color: #cfe; min-height: 6em; white-space: pre; }

      /* Presets, merged into the route panel. */
      .presets-section { margin-top: 2px; }
      .presets-title { color: #cfe; margin-bottom: 4px; font-size: 11px; }
      #presets-list { list-style: none; padding: 0; margin: 0; }
      #presets-list li {
        padding: 3px 6px;
        cursor: pointer;
        border-radius: 3px;
      }
      #presets-list li:hover { background: #2c4a6e; color: #fff; }

      /* ─── Recap panel (top-right) ────────────────────────────────────── */
      #recap {
        top: 12px;
        right: 12px;
        /* Shrink-wrap the content: when collapsed the box hugs the plane;
           when expanded it grows to the recap table. */
        width: fit-content;
        max-width: calc(100vw - 24px);
        font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
        display: none;
      }
      /* Column layout, right-aligned: toggle, plane and table all hug the
         screen edge, clear of the iPhone notch (panel is anchored top-right). */
      #recap.visible { display: flex; flex-direction: column; align-items: flex-end; }
      #recap .panel-body {
        padding: 0 12px 10px;
        max-height: 60vh;
        overflow-y: auto;
      }
      #recap .title { margin-bottom: 6px; color: #cfe; }
      #recap table { border-collapse: collapse; }
      #recap td { padding: 1px 10px 1px 0; vertical-align: top; }
      #recap td.time { color: #9ab; white-space: nowrap; }
      #recap tr.phase-DAY      td.label { color: #ffe28a; }
      #recap tr.phase-TWILIGHT td.label { color: #c79bff; }
      #recap tr.phase-NIGHT    td.label { color: #7faaff; }
      #recap tr.endpoint       td.label { color: #fff; }
      #recap tr.current td { background: #2c4a6e; }
      #recap tr.current td.label { color: #fff; }
      #recap .stats-title { margin: 8px 0 4px; color: #cfe; font-size: 11px; }
      #recap table.stats td { padding: 1px 8px 1px 0; }
      #recap table.stats td.pct { color: #fff; text-align: right; padding: 1px 0 1px 12px; }
      #recap table.stats td.sun-pct { text-align: center; color: #ffe28a; padding: 2px 0; }
      #recap .sun-viz { display: flex; justify-content: flex-end; padding: 2px 6px 6px; }
      /* 150px on desktop, ~80px on a 390px-wide iPhone, scaling between. */
      #recap .sun-viz svg { display: block; width: min(150px, 20.5vw); height: auto; }
      #recap .sun-viz path.plane {
        fill: none;
        stroke: #cfe;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #recap #sun-icon { transition: opacity 0.25s; }
      #recap #sun-icon.hidden { opacity: 0; }
    </style>
  </head>
  <body>
    <div id="info" class="panel">
      <button type="button" class="panel-toggle">
        <span class="chevron">▸</span>
        <span>Settings</span>
      </button>
      <div class="panel-body">
        <div id="info-text"></div>
        <div><label>Day/night contrast <input id="contrast" type="range" min="0" max="100" value="50" /></label></div>
      </div>
    </div>
    <form id="route-form" class="panel">
      <div class="panel-body">
        <div class="row">
          <div class="iata-combo">
            <input id="route-from" class="iata" type="text" placeholder="IATA, city, or name" autocomplete="off" />
          </div>
          <span>→</span>
          <div class="iata-combo">
            <input id="route-to" class="iata" type="text" placeholder="IATA, city, or name" autocomplete="off" />
          </div>
          <button type="submit">Show route</button>
        </div>
        <div class="row" id="via-row">
          <label>Via</label>
          <div id="via-list"></div>
          <button type="button" id="add-waypoint" class="add-wp">+ Add waypoint</button>
        </div>
        <div class="row">
          <label>Dep <input id="dep-time" type="datetime-local" /></label>
          <span id="dep-tz" class="tz-info"></span>
        </div>
        <div class="row">
          <label>Arr</label>
          <div class="seg-toggle">
            <button type="button" id="end-mode-dt" class="active">Datetime</button>
            <button type="button" id="end-mode-dur">Duration</button>
          </div>
          <input id="arr-time" type="datetime-local" />
          <input id="arr-duration" type="text" placeholder="11h 30m" style="display: none;" />
          <span id="arr-tz" class="tz-info"></span>
        </div>
        <div id="route-status"></div>
        <div id="flight-hud"></div>
        <div class="presets-section">
          <div class="presets-title">Preset routes</div>
          <ul id="presets-list"></ul>
        </div>
      </div>
      <div class="panel-bar">
        <button type="button" class="panel-toggle">
          <span class="chevron">▸</span>
          <span>Route</span>
        </button>
        <button id="play-btn" type="button">▶ Play</button>
        <input id="scrub" type="range" min="0" max="1000" value="0" />
      </div>
    </form>
    <div id="recap" class="panel">
      <button type="button" class="panel-toggle">
        <span class="chevron">▸</span>
        <span>Flight recap</span>
      </button>
      <div class="sun-viz">
        <svg viewBox="-100 -100 200 200" width="240" height="240">
          <!-- Commercial jet outline (top-down, facing up):
               rounded nose, swept main wings, smaller swept tail wings. -->
          <path class="plane" d="
            M 0 -62
            L 4 -54
            L 6 -45
            L 6 -10
            L 60 14
            L 44 22
            L 6 8
            L 6 30
            L 22 42
            L 14 46
            L 6 36
            L 5 52
            L 0 56
            L -5 52
            L -6 36
            L -14 46
            L -22 42
            L -6 30
            L -6 8
            L -44 22
            L -60 14
            L -6 -10
            L -6 -45
            L -4 -54
            Z" />
          <!-- Sun (orbits around plane via JS transform). -->
          <g id="sun-icon" transform="translate(0,-80)">
            <circle cx="0" cy="0" r="8" fill="#ffcc33" />
            <g stroke="#ffcc33" stroke-width="2.4" stroke-linecap="round">
              <line x1="0" y1="-16" x2="0" y2="-12" />
              <line x1="0" y1="12"  x2="0" y2="16" />
              <line x1="-16" y1="0" x2="-12" y2="0" />
              <line x1="12"  y1="0" x2="16"  y2="0" />
              <line x1="-12" y1="-12" x2="-9" y2="-9" />
              <line x1="9"   y1="9"   x2="12" y2="12" />
              <line x1="-12" y1="12"  x2="-9" y2="9" />
              <line x1="9"   y1="-9"  x2="12" y2="-12" />
            </g>
          </g>
        </svg>
      </div>
      <div class="panel-body">
        <div class="title"></div>
        <table></table>
        <div class="stats-title"></div>
        <table class="stats"></table>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
