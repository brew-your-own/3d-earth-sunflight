<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D in Browser</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; background: #000; }
      canvas { display: block; }
      #info {
        position: fixed;
        top: 12px;
        left: 12px;
        color: #aaa;
        font: 13px/1.6 monospace;
        pointer-events: none;
        user-select: none;
      }
      /* Only the slider intercepts pointer events — clicks still reach the canvas elsewhere. */
      #info input[type="range"] {
        width: 110px;
        accent-color: #66aaff;
        vertical-align: middle;
        pointer-events: auto;
      }
      #info label { display: inline-flex; gap: 6px; align-items: center; }
      #route-form {
        position: fixed;
        bottom: 12px;
        left: 12px;
        padding: 10px 12px;
        background: rgba(0, 0, 0, 0.55);
        border-radius: 6px;
        color: #ddd;
        font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 360px;
      }
      #route-form .row { display: flex; gap: 6px; align-items: center; }
      #route-form .row label { display: flex; gap: 6px; align-items: center; }
      #route-form input[type="text"], #route-form .iata {
        width: 120px;
        padding: 4px 6px;
        background: #111;
        color: #fff;
        border: 1px solid #444;
        border-radius: 4px;
        font: inherit;
      }
      .iata-combo { position: relative; }
      .iata-suggest {
        display: none;
        position: absolute;
        bottom: 100%;
        left: 0;
        margin: 0 0 4px 0;
        padding: 4px 0;
        list-style: none;
        background: #1a1a1a;
        border: 1px solid #555;
        border-radius: 4px;
        min-width: 340px;
        max-height: 240px;
        overflow-y: auto;
        z-index: 10;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6);
      }
      .iata-suggest.open { display: block; }
      .iata-suggest li {
        padding: 4px 10px;
        cursor: pointer;
        display: grid;
        grid-template-columns: 42px 1fr;
        column-gap: 8px;
        font-size: 12px;
        white-space: nowrap;
      }
      .iata-suggest li.selected { background: #2c4a6e; }
      .iata-suggest li:hover { background: #24405f; }
      .iata-suggest .code { color: #fff; font-weight: bold; }
      .iata-suggest .where { color: #cde; }
      .iata-suggest .name { color: #889; font-size: 11px; grid-column: 2; }
      #route-form input[type="datetime-local"] {
        padding: 3px 6px;
        background: #111;
        color: #fff;
        border: 1px solid #444;
        border-radius: 4px;
        font: inherit;
        color-scheme: dark;
      }
      #route-form input[type="range"] { flex: 1; accent-color: #66aaff; }
      #route-form button {
        padding: 4px 10px;
        background: #2a2a2a;
        color: #fff;
        border: 1px solid #555;
        border-radius: 4px;
        font: inherit;
        cursor: pointer;
      }
      #route-form button:hover { background: #3a3a3a; }
      #route-form button:disabled { opacity: 0.45; cursor: not-allowed; }
      #route-status { color: #aaa; min-height: 1.2em; }
      #route-status.error { color: #ff6b6b; }
      #flight-hud { color: #cfe; min-height: 4.6em; white-space: pre; }
      #recap {
        position: fixed;
        bottom: 12px;
        right: 12px;
        padding: 10px 12px;
        background: rgba(0, 0, 0, 0.55);
        border-radius: 6px;
        color: #ddd;
        font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
        max-height: 70vh;
        overflow-y: auto;
        min-width: 240px;
        display: none;
      }
      #recap.visible { display: block; }
      #recap .title { margin-bottom: 6px; color: #cfe; }
      #recap table { border-collapse: collapse; }
      #recap td { padding: 1px 10px 1px 0; vertical-align: top; }
      #recap td.time { color: #9ab; white-space: nowrap; }
      #recap tr.phase-DAY      td.label { color: #ffe28a; }
      #recap tr.phase-TWILIGHT td.label { color: #c79bff; }
      #recap tr.phase-NIGHT    td.label { color: #7faaff; }
      #recap tr.endpoint       td.label { color: #fff; }
    </style>
  </head>
  <body>
    <div id="info">
      <div id="info-text"></div>
      <div><label>Contrast <input id="contrast" type="range" min="0" max="100" value="50" /></label></div>
    </div>
    <form id="route-form">
      <div class="row">
        <div class="iata-combo">
          <input id="route-from" class="iata" type="text" placeholder="IATA, city, or name" autocomplete="off" />
        </div>
        <span>→</span>
        <div class="iata-combo">
          <input id="route-to" class="iata" type="text" placeholder="IATA, city, or name" autocomplete="off" />
        </div>
        <button type="submit">Show route</button>
      </div>
      <div class="row">
        <label>Dep <input id="dep-time" type="datetime-local" /></label>
      </div>
      <div class="row">
        <label>Arr <input id="arr-time" type="datetime-local" /></label>
      </div>
      <div class="row">
        <button id="play-btn" type="button">▶ Play</button>
        <input id="scrub" type="range" min="0" max="1000" value="0" />
      </div>
      <div id="route-status"></div>
      <div id="flight-hud"></div>
    </form>
    <div id="recap">
      <div class="title"></div>
      <table></table>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
